<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding Dashboard · Monica Macaes</title>
<meta name="description" content="Interactive dashboard of Monica Macaes's GitHub activity: languages and a puzzle-piece contribution calendar.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--accent:#4B9CD3;--bg:#0B1220;--card:#111A2E;--line:#22304D;--text:#E6EDF7;--muted:#8FA3BF;--empty:#16213A}
  :root[data-theme="light"]{--bg:#F7F6F2;--card:#FFFFFF;--line:#E2E6EE;--text:#13294B;--muted:#5B6B85;--empty:#E9EDF4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;transition:background .3s,color .3s}
  main{max-width:960px;margin:0 auto;padding:28px 16px 60px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
  h1{font-size:24px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
  .sw[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:2px}
  input[type=color]{width:30px;height:30px;border:none;background:none;cursor:pointer;padding:0}
  button.pill{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
  button.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi b{display:block;font-size:26px;color:var(--accent)}
  .kpi span{font-size:12px;color:var(--muted)}
  h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .langs{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:12px}
  .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-bottom:14px}
  .stack div{transition:width .6s,opacity .2s}
  .row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;cursor:pointer}
  .row:hover,.row.on{background:var(--line)}
  .dot{width:12px;height:12px;border-radius:50%}
  .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;transition:width .6s}
  .pct{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
  .donut{display:flex;justify-content:center}
  #puzzle{width:100%;height:auto;display:block}
  #puzzle path{transition:transform .15s,fill .3s;transform-box:fill-box;transform-origin:center;cursor:pointer}
  #puzzle path:hover{transform:scale(1.5)}
  .tip{position:fixed;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:9}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
  .stats b{display:block;font-size:20px;color:var(--accent)}
  .stats span{font-size:11px;color:var(--muted)}
  footer{margin-top:18px;font-size:12px;color:var(--muted)}
  a{color:var(--accent)}
  @media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.langs{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>My coding dashboard</h1><div class="sub" id="updated">Loading live data…</div></div>
    <div class="controls" aria-label="Customize">
      <span class="sub">Color</span>
      <div id="swatches" class="controls"></div>
      <input type="color" id="custom" aria-label="Pick any color" value="#4B9CD3">
      <button class="pill" id="theme" aria-pressed="false">☀︎ Light</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="langs">
    <div class="card">
      <h2><span>Languages</span>
        <span class="controls">
          <button class="pill" data-view="by_bytes" aria-pressed="true">Code mix</button>
          <button class="pill" data-view="by_repo" aria-pressed="false">By repository</button>
        </span></h2>
      <div class="stack" id="stack"></div>
      <div id="rows"></div>
    </div>
    <div class="card"><h2><span>Share</span></h2><div class="donut"><svg id="donut" width="220" height="220" viewBox="0 0 220 220"></svg></div></div>
  </section>

  <section class="card">
    <h2><span>My year, one puzzle piece per day</span><span id="hint">hover a piece</span></h2>
    <svg id="puzzle"></svg>
    <div class="stats" id="stats"></div>
  </section>

  <footer>Data refreshed daily by a GitHub Action from my public repos · <a href="https://github.com/momacaes9">github.com/momacaes9</a> · <a href="/">portfolio</a></footer>
</main>
<div class="tip" id="tip"></div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/momacaes9/momacaes9/main/assets/stats.json";
const COLORS = {Python:"#3572A5",TypeScript:"#3178C6",JavaScript:"#F1E05A",HTML:"#E34C26",CSS:"#663399",SCSS:"#C6538C",Swift:"#F05138",R:"#198CE7",Rust:"#DEA584",Shell:"#89E051",PLpgSQL:"#336790",Dockerfile:"#384D54",C:"#555555","Objective-C":"#438EFF",Other:"#8FA3BF"};
const SWATCHES = ["#4B9CD3","#3FB950","#A371F7","#F778BA","#F0883E","#E3B341"];
const root = document.documentElement;
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let data = null, view = "by_bytes", focus = null;

// ---------- color + theme
function mix(hex, t, toward){ // blend hex toward another hex by t (0..1)
  const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const a=p(hex), b=p(toward);
  return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function setAccent(hex){
  root.style.setProperty("--accent", hex); store.set("dash-accent", hex);
  document.getElementById("custom").value = hex;
  document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed", b.dataset.c.toLowerCase()===hex.toLowerCase()));
  if (data) drawPuzzle();
}
function setTheme(t){
  root.dataset.theme = t; store.set("dash-theme", t);
  const b = document.getElementById("theme"); b.textContent = t==="light" ? "☾ Dark" : "☀︎ Light";
  if (data) drawPuzzle();
}
SWATCHES.forEach(c=>{const b=document.createElement("button");b.className="sw";b.dataset.c=c;b.style.background=c;b.title=c;b.setAttribute("aria-label","Accent "+c);b.onclick=()=>setAccent(c);swatches.appendChild(b);});
custom.oninput = e=>setAccent(e.target.value);
theme.onclick = ()=>setTheme(root.dataset.theme==="light"?"dark":"light");
setTheme(store.get("dash-theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
setAccent(store.get("dash-accent") || SWATCHES[0]);

// ---------- languages
function shares(obj, top=6){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0)||1;
  const s = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const out = s.slice(0,top).map(([k,v])=>[k,v/tot*100]);
  const rest = s.slice(top).reduce((a,[,v])=>a+v,0);
  if (rest) out.push(["Other", rest/tot*100]);
  return out;
}
function drawLangs(){
  const items = shares(data[view]);
  stack.innerHTML = items.map(([k,p])=>`<div title="${k} ${p.toFixed(1)}%" style="width:${p}%;background:${COLORS[k]||COLORS.Other};opacity:${!focus||focus===k?1:.25}"></div>`).join("");
  rows.innerHTML = items.map(([k,p])=>`<div class="row ${focus===k?"on":""}" data-k="${k}"><span class="dot" style="background:${COLORS[k]||COLORS.Other}"></span><span>${k}</span><span class="pct">${p.toFixed(1)}%</span><span class="bar"><i style="width:${p}%;background:${COLORS[k]||COLORS.Other}"></i></span></div>`).join("");
  rows.querySelectorAll(".row").forEach(r=>r.onclick=()=>{focus = focus===r.dataset.k?null:r.dataset.k; drawLangs();});
  const R=80, C=2*Math.PI*R; let off=0, svg=`<circle cx="110" cy="110" r="${R}" fill="none" stroke="var(--line)" stroke-width="26"/>`;
  items.forEach(([k,p])=>{const seg=C*p/100; svg+=`<circle cx="110" cy="110" r="${R}" fill="none" stroke="${COLORS[k]||COLORS.Other}" stroke-width="${focus===k?34:26}" stroke-dasharray="${seg} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 110 110)" opacity="${!focus||focus===k?1:.25}"><title>${k} ${p.toFixed(1)}%</title></circle>`; off+=seg;});
  const top = items.find(([k])=>k===focus) || items[0] || ["—",0];
  svg += `<text x="110" y="112" text-anchor="middle" font-size="28" font-weight="700" fill="var(--text)">${top[1].toFixed(0)}%</text><text x="110" y="134" text-anchor="middle" font-size="13" fill="var(--muted)">${top[0]}</text>`;
  donut.innerHTML = svg;
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;focus=null;document.querySelectorAll("[data-view]").forEach(x=>x.setAttribute("aria-pressed",x===b));drawLangs();});

// ---------- puzzle
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h;}
const sign = (...k)=> (hash(k.join(","))&1) ? 1 : -1;
function piece(x,y,s,e){ // e=[top,right,bottom,left], 0 flat, ±1 knob
  const c=[[x,y],[x+s,y],[x+s,y+s],[x,y+s]]; let d=`M${x},${y}`;
  e.forEach((k,i)=>{const [x0,y0]=c[i],[x1,y1]=c[(i+1)%4],dx=(x1-x0)/s,dy=(y1-y0)/s,nx=dy,ny=-dx;
    const P=(t,u)=>`${(x0+dx*t*s+nx*k*u*s).toFixed(2)},${(y0+dy*t*s+ny*k*u*s).toFixed(2)}`, h=.27;
    if(k) d+=`L${P(.36,0)}C${P(.24,h*.55)} ${P(.3,h)} ${P(.5,h)}C${P(.7,h)} ${P(.76,h*.55)} ${P(.64,0)}`;
    d+=`L${x1},${y1}`;});
  return d+"Z";
}
function drawPuzzle(){
  const days=data.days, dates=Object.keys(days).sort();
  const first=new Date(dates[0]+"T00:00"); const start=new Date(first); start.setDate(first.getDate()-first.getDay());
  const grid=new Map(); dates.forEach(ds=>{const i=Math.round((new Date(ds+"T00:00")-start)/864e5); grid.set(`${Math.floor(i/7)},${i%7}`,[days[ds],ds]);});
  const weeks=Math.max(...[...grid.keys()].map(k=>+k.split(",")[0]))+1, s=16, ox=34, oy=20;
  puzzle.setAttribute("viewBox",`0 0 ${ox+weeks*s+10} ${oy+7*s+8}`);
  const nz=Object.values(days).filter(v=>v).sort((a,b)=>a-b), q=[.25,.5,.75].map(f=>nz[Math.floor(nz.length*f)]||1);
  const cs=getComputedStyle(root), acc=cs.getPropertyValue("--accent").trim(), bg=cs.getPropertyValue("--bg").trim(), empty=cs.getPropertyValue("--empty").trim();
  const light=root.dataset.theme==="light";
  const levels=[empty, mix(acc,.65,light?"#ffffff":bg), mix(acc,.4,light?"#ffffff":bg), acc, mix(acc,.45,light?"#000000":"#ffffff")];
  let out="", months=new Set();
  for(let w=0;w<weeks;w++){const d=new Date(start);d.setDate(start.getDate()+w*7); const key=d.getFullYear()+"-"+d.getMonth();
    if(d.getDate()<=7&&!months.has(key)&&w<weeks-1){months.add(key);out+=`<text x="${ox+w*s}" y="12" font-size="10" fill="var(--muted)">${d.toLocaleString("en",{month:"short"})}</text>`;}}
  [[1,"Mon"],[3,"Wed"],[5,"Fri"]].forEach(([d,l])=>out+=`<text x="${ox-6}" y="${oy+d*s+11}" font-size="9" text-anchor="end" fill="var(--muted)">${l}</text>`);
  const empties=[], fills=[];
  grid.forEach(([v,ds],k)=>{const [w,d]=k.split(",").map(Number), has=(a,b)=>grid.has(`${a},${b}`);
    const e=[has(w,d-1)?-sign("v",w,d-1):0, has(w+1,d)?sign("h",w,d):0, has(w,d+1)?sign("v",w,d):0, has(w-1,d)?-sign("h",w-1,d):0];
    const lv=v?1+q.filter(t=>v>t).length:0;
    (lv?fills:empties).push(`<path d="${piece(ox+w*s,oy+d*s,s,e)}" fill="${levels[lv]}" stroke="${bg}" stroke-width="1.2" data-v="${v}" data-d="${ds}"/>`);});
  puzzle.innerHTML=out+empties.join("")+fills.join("");
  puzzle.querySelectorAll("path").forEach(p=>{
    p.onmousemove=e=>{tip.textContent=`${p.dataset.v} contribution${p.dataset.v==="1"?"":"s"} · ${new Date(p.dataset.d+"T00:00").toLocaleDateString("en",{month:"short",day:"numeric",year:"numeric"})}`;tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY-28+"px";tip.style.opacity=1;};
    p.onmouseleave=()=>tip.style.opacity=0;});
  const vals=dates.map(d=>days[d]); let run=0,longest=0; vals.forEach(v=>{run=v?run+1:0;longest=Math.max(longest,run)});
  let cur=0; for(let i=vals.length-1;i>=0;i--){if(vals[i])cur++;else if(i<vals.length-1)break;}
  const best=dates.reduce((a,b)=>days[b]>days[a]?b:a,dates[0]);
  stats.innerHTML=[[vals.reduce((a,b)=>a+b,0),"contributions"],[vals.filter(Boolean).length,"pieces placed"],[cur+" days","current streak"],[longest+" days","longest streak"],[days[best]?new Date(best+"T00:00").toLocaleDateString("en",{month:"short",day:"numeric"}):"—","best day"]]
    .map(([b,s])=>`<div><b>${b}</b><span>${s}</span></div>`).join("");
}

// ---------- load
fetch(DATA_URL,{cache:"no-store"}).then(r=>r.json()).then(d=>{
  data=d;
  updated.textContent=`Live from GitHub · updated ${d.updated||""}`;
  kpis.innerHTML=[[d.repos,"public repos"],[Object.keys(d.by_bytes).length,"languages"],[d.commits,"commits this year"],[d.stars,"stars"]]
    .map(([b,s])=>`<div class="card kpi"><b>${b}</b><span>${s}</span></div>`).join("");
  drawLangs(); drawPuzzle();
}).catch(()=>{updated.textContent="Could not load live data right now. Try again in a minute.";});
</script>
</body>
</html>
